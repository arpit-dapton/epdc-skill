<!--
  EPD external signup form - plain HTML + vanilla JS, no build step.

  Copy this file as-is. Change only:
    1. EPD_API_BASE, if the user named an environment other than dev
    2. PARTNER_KEY, if the user gave one. See references/partner-key.md.
    3. the styles, to match the host page

  Do not rename the fields, drop the honeypot, or edit the UTM block.
-->

<style>
  .epd-field { margin-bottom: 1rem; }
  .epd-field label { display: block; margin-bottom: 0.25rem; }
  .epd-field input,
  .epd-field select { display: block; width: 100%; padding: 0.5rem; }
  .epd-field [aria-invalid='true'] { border-color: #c00; }
  /* Shrunk to 1px in place, not pushed off-screen: a left offset scrolls
     right-to-left pages sideways. */
  .epd-hp {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .epd-error { color: #c00; min-height: 1.25rem; }
</style>

<!--
  method="post" keeps visitor details out of the URL if the script below is
  stripped or never runs. data-epd-signup is how the script finds the form.
-->
<form data-epd-signup method="post" novalidate>
  <div class="epd-field">
    <label for="epd-first-name">First name</label>
    <input
      id="epd-first-name"
      name="firstName"
      type="text"
      autocomplete="given-name"
      required
      minlength="2"
      maxlength="20"
    />
  </div>

  <div class="epd-field">
    <label for="epd-last-name">Last name</label>
    <input
      id="epd-last-name"
      name="lastName"
      type="text"
      autocomplete="family-name"
      required
      minlength="2"
      maxlength="20"
    />
  </div>

  <div class="epd-field">
    <label for="epd-company">Company name</label>
    <input
      id="epd-company"
      name="companyName"
      type="text"
      autocomplete="organization"
      required
      minlength="3"
      maxlength="150"
    />
  </div>

  <div class="epd-field">
    <label for="epd-email">Email</label>
    <input id="epd-email" name="email" type="email" autocomplete="email" required />
  </div>

  <!-- Options are loaded from EPD when the page opens. -->
  <div class="epd-field">
    <label for="epd-country">Country</label>
    <select id="epd-country" name="country" required>
      <option value="">Select...</option>
    </select>
  </div>

  <div class="epd-field">
    <label for="epd-industry">Industry</label>
    <select id="epd-industry" name="industry" required>
      <option value="">Select...</option>
    </select>
  </div>

  <!-- Shown only when the industry is "Other". -->
  <div class="epd-field" data-epd-industry-other hidden>
    <label for="epd-industry-other">Specify your industry</label>
    <input id="epd-industry-other" name="industryOther" type="text" maxlength="255" disabled />
  </div>

  <div class="epd-field">
    <label for="epd-yearly-sales">Estimated yearly sales (USD)</label>
    <input
      id="epd-yearly-sales"
      name="estimatedYearlySales"
      type="number"
      inputmode="decimal"
      min="1"
      step="any"
      required
    />
  </div>

  <div class="epd-field">
    <label for="epd-website">Company website</label>
    <input
      id="epd-website"
      name="website"
      type="text"
      inputmode="url"
      autocomplete="url"
      placeholder="example.com"
      required
    />
  </div>

  <div class="epd-field">
    <label for="epd-card-payments">How are you currently accepting card payments?</label>
    <select id="epd-card-payments" name="cardPaymentMethod" required>
      <option value="">Select...</option>
      <option value="not_accepting_yet">Not accepting payments yet</option>
      <option value="stripe">Stripe</option>
      <option value="paypal">PayPal</option>
      <option value="square">Square</option>
      <option value="shopping_cart_or_funnel">A shopping cart or funnel</option>
      <option value="another_processor">Another processor</option>
    </select>
  </div>

  <!-- Honeypot. Hidden from people, filled by bots. Do not remove. -->
  <div class="epd-hp" aria-hidden="true">
    <label for="epd-homepage">Homepage</label>
    <input id="epd-homepage" name="homepage" type="text" tabindex="-1" autocomplete="off" />
  </div>

  <button type="submit">Next</button>
  <p class="epd-error" role="alert"></p>
</form>

<script>
  (function () {
    const EPD_API_BASE = 'https://api-dev.dev1.epd.com';

    // Your EasyPayDirect partner key (Integration → API Integration → Partner key).
    // Leave '' for no key. Never the "API Key - Authorization" value: that is secret.
    const PARTNER_KEY = '';

    const FORM_FIELDS = [
      'firstName',
      'lastName',
      'companyName',
      'email',
      'country',
      'industry',
      'industryOther',
      'estimatedYearlySales',
      'website',
      'cardPaymentMethod',
    ];

    // EPD's id for the "Other" industry, which needs industryOther filled in.
    const INDUSTRY_OTHER = '53';

    // Country and industry options, loaded once and shared by every form on the page.
    // EPD answers { data: [{ id, name }] }.
    const lists = {};
    function loadList(key) {
      if (!lists[key]) {
        lists[key] = fetch(EPD_API_BASE + '/emap/lists/' + key)
          .then(function (res) {
            if (!res.ok) throw new Error('List request failed');
            return res.json();
          })
          .then(function (data) {
            return (data && data.data) || [];
          })
          .catch(function (err) {
            delete lists[key];
            throw err;
          });
      }
      return lists[key];
    }

    // EPD sends the visitor to its own pages only. Anything else in redirectUrl (a
    // non-https scheme, another domain, credentials in the URL) is not followed.
    // The parent domain is taken from EPD_API_BASE, so it follows an environment switch.
    // Plain http is allowed only for localhost, where a local EPD runs without TLS.
    function safeRedirect(url) {
      try {
        const target = new URL(url);
        const parent = new URL(EPD_API_BASE).hostname.split('.').slice(-2).join('.');
        const trusted = target.hostname === parent || target.hostname.endsWith('.' + parent);
        const local = target.hostname === 'localhost' || target.hostname === '127.0.0.1';
        const secure = target.protocol === 'https:' || (local && target.protocol === 'http:');
        return secure && !target.username && !target.password && trusted
          ? target.href
          : null;
      } catch (err) {
        return null;
      }
    }

    // A normal signup answers in a few seconds. This only stops a request that
    // hangs, and is long enough not to cut off a slow one that would succeed.
    const TIMEOUT_MS = 60000;

    const TIMEOUT_MESSAGE = 'This is taking longer than expected. Please try again.';

    // EPD errors look like { error: { message, field_errors: [{ field, message }] } }.
    // field_errors can lead with a property that is not one of the inputs (an
    // unrecognized key), so prefer the first error on a real form field.
    function readError(data) {
      const apiError = (data && data.error) || {};
      const fieldError = (apiError.field_errors || []).find(function (e) {
        return e && FORM_FIELDS.indexOf(e.field) !== -1 && e.message;
      });
      if (fieldError) return { message: fieldError.message, field: fieldError.field };
      return {
        message:
          apiError.message ||
          (data && data.message) ||
          'Please check your details and try again.',
      };
    }

    // 429: EPD's own message, plus how long to wait from the Retry-After header
    // (seconds, or an HTTP date). The browser can only read that header when
    // EPD's CORS exposes it; without it the message goes out on its own.
    function rateLimitMessage(data, res) {
      const apiError = (data && data.error) || {};
      let message =
        apiError.message ||
        (data && data.message) ||
        'Too many attempts. Please try again later.';

      const header = (res.headers.get('Retry-After') || '').trim();
      const seconds = /^\d+$/.test(header)
        ? Number(header)
        : (Date.parse(header) - Date.now()) / 1000;
      if (seconds > 0) {
        const minutes = Math.ceil(seconds / 60);
        if (!/[.!?]$/.test(message)) message += '.';
        message +=
          ' You can try again in ' + minutes + (minutes === 1 ? ' minute.' : ' minutes.');
      }
      return message;
    }

    function text(formData, key) {
      const value = formData.get(key);
      return typeof value === 'string' ? value.trim() : '';
    }

    // True when the honeypot is too small for a person to see or type into.
    function isHidden(el) {
      const box = el.getBoundingClientRect();
      return box.width < 5 && box.height < 5;
    }

    // Sets up every signup form on the page that is not set up yet. A second
    // form on the page (a hero and a footer) needs only its <form> repeated; a
    // second copy of this whole file also works.
    function setUp(form) {
      form.setAttribute('data-epd-ready', '');

      // Every copy has the same ids, so a later copy's labels would point at the
      // first copy's inputs. Give this copy's inputs ids of their own.
      for (const label of form.querySelectorAll('label[for]')) {
        const id = label.htmlFor;
        const input = form.querySelector('#' + CSS.escape(id));
        if (!input || document.getElementById(id) === input) continue;
        let n = 2;
        while (document.getElementById(id + '-' + n)) n++;
        input.id = id + '-' + n;
        label.htmlFor = input.id;
      }

      // Found by what they do, not by exact attributes: restyling the form often
      // swaps in the site's own button (no type="submit") or its own error text
      // (no role="alert"). A lookup that came back empty would crash on submit
      // and the visitor would see nothing happen.
      const buttons = form.querySelectorAll(
        'button:not([type="button"]):not([type="reset"]), input[type="submit"]'
      );
      let errorEl = form.querySelector('[role="alert"]');
      if (!errorEl) {
        errorEl = document.createElement('p');
        errorEl.className = 'epd-error';
        errorEl.setAttribute('role', 'alert');
        form.appendChild(errorEl);
      }

      // Each button's own label, put back when the form stops being busy.
      const labels = new Map();
      for (const button of buttons) {
        labels.set(button, button.tagName === 'INPUT' ? button.value : button.innerHTML);
      }

      function setBusy(busy) {
        if (busy) form.setAttribute('aria-busy', 'true');
        else form.removeAttribute('aria-busy');
        for (const button of buttons) {
          button.disabled = busy;
          if (button.tagName === 'INPUT') button.value = busy ? 'Please wait...' : labels.get(button);
          else if (busy) button.textContent = 'Please wait...';
          else button.innerHTML = labels.get(button);
        }
      }

      function clearErrors() {
        errorEl.textContent = '';
        for (const el of form.querySelectorAll('[aria-invalid]')) {
          el.removeAttribute('aria-invalid');
        }
      }

      function showError(message, field) {
        errorEl.textContent = message;
        if (!field) return;
        const input = form.querySelector('[name="' + field + '"]');
        if (input) {
          input.setAttribute('aria-invalid', 'true');
          input.focus();
        }
      }

      for (const pair of [
        ['country', 'countries'],
        ['industry', 'industryTypes'],
      ]) {
        const select = form.elements.namedItem(pair[0]);
        loadList(pair[1])
          .then(function (items) {
            for (const item of items) {
              select.appendChild(new Option(item.name, String(item.id)));
            }
          })
          .catch(function () {
            showError('Could not load the form. Please refresh the page.');
          });
      }

      // industryOther is asked, and sent, only for the "Other" industry.
      const industry = form.elements.namedItem('industry');
      const industryOther = form.elements.namedItem('industryOther');
      const industryOtherField = form.querySelector('[data-epd-industry-other]');
      industry.addEventListener('change', function () {
        const other = industry.value === INDUSTRY_OTHER;
        industryOtherField.hidden = !other;
        industryOther.disabled = !other;
        industryOther.required = other;
      });

      // Back button after the redirect restores this page from the browser's
      // cache with the button still disabled. Turn it back on.
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) setBusy(false);
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        clearErrors();

        // iPhone and Mac type a curly apostrophe (O’Brien) by default. The API
        // only accepts a straight one, so swap it before validating.
        for (const name of ['firstName', 'lastName']) {
          const input = form.elements.namedItem(name);
          input.value = input.value.replace(/[\u2018\u2019\u02BC]/g, "'");
        }

        const formData = new FormData(form);

        // Honeypot tripped. Act like it worked and send nothing. Only when the
        // field is really hidden: a page that blocks inline styles shows it, and
        // a person who fills it in must not be dropped.
        if (text(formData, 'homepage') && isHidden(form.elements.namedItem('homepage').parentElement)) {
          return;
        }

        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        // Build the body from named fields only. Never spread the whole FormData:
        // hidden inputs the host page already had would leak in as unrecognized
        // keys and the API would reject the request.
        const body = {
          firstName: text(formData, 'firstName'),
          lastName: text(formData, 'lastName'),
          companyName: text(formData, 'companyName'),
          email: text(formData, 'email'),
          country: Number(text(formData, 'country')),
          industry: Number(text(formData, 'industry')),
          estimatedYearlySales: Number(text(formData, 'estimatedYearlySales')),
          website: text(formData, 'website'),
          cardPaymentMethod: text(formData, 'cardPaymentMethod'),
        };
        if (text(formData, 'industry') === INDUSTRY_OTHER) {
          body.industryOther = text(formData, 'industryOther');
        }

        if (PARTNER_KEY.trim()) body.partnerKey = PARTNER_KEY.trim();

        // UTM and ad click-ID attribution. Read-only: never written back to the URL or history,
        // never a form field. Each value is sent only when the page URL carries
        // it. No defaults: a param the URL does not carry is not sent.
        const params = new URLSearchParams(window.location.search);
        const utm = function (param) {
          return (params.get(param) || '').trim().slice(0, 100);
        };
        for (const pair of [
          ['utmSource', 'utm_source'],
          ['utmMedium', 'utm_medium'],
          ['utmCampaign', 'utm_campaign'],
          ['utmTerm', 'utm_term'],
          ['utmContent', 'utm_content'],
        ]) {
          const value = utm(pair[1]);
          if (value) body[pair[0]] = value;
        }

        // Ad click IDs go inside utmParams, keyed as they appear in the URL. The
        // API has no top-level field for them and rejects unrecognized properties (400).
        const utmParams = {};
        for (const param of ['gclid', 'gbraid', 'wbraid', 'fbclid']) {
          const value = utm(param);
          if (value) utmParams[param] = value;
        }
        if (Object.keys(utmParams).length > 0) body.utmParams = utmParams;

        setBusy(true);

        const controller = new AbortController();
        const timer = setTimeout(function () {
          controller.abort();
        }, TIMEOUT_MS);

        try {
          const res = await fetch(EPD_API_BASE + '/v1/external-signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            signal: controller.signal,
          });
          clearTimeout(timer);

          const data = await res.json().catch(function () {
            return null;
          });

          if (res.status === 429) {
            showError(rateLimitMessage(data, res));
            setBusy(false);
            return;
          }

          if (!res.ok) {
            const apiError = readError(data);
            showError(apiError.message, apiError.field);
            setBusy(false);
            return;
          }

          if (!data || !data.redirectUrl) {
            showError('Something went wrong. Please try again.');
            setBusy(false);
            return;
          }

          const target = safeRedirect(data.redirectUrl);
          if (!target) {
            showError('Something went wrong. Please try again.');
            setBusy(false);
            return;
          }

          // Works for both branches: a new lead goes to EPD's signup page with these
          // answers filled in, an existing account goes to login. Do not tell the visitor which one happened
          // (data.alreadyRegistered): that would reveal whether an email has an account.
          window.location.href = target;
          // Button stays disabled on purpose while the browser navigates away.
        } catch (err) {
          clearTimeout(timer);
          showError(
            controller.signal.aborted ? TIMEOUT_MESSAGE : 'Something went wrong. Please try again.'
          );
          setBusy(false);
        }
      });
    }

    function setUpAll() {
      for (const form of document.querySelectorAll('form[data-epd-signup]:not([data-epd-ready])')) {
        setUp(form);
      }
    }

    // The script can end up above the form (in <head>, or enqueued by a theme).
    // Wait for the page to be parsed so the form exists when we look for it.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setUpAll);
    } else {
      setUpAll();
    }
  })();
</script>
